<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Security headers are set by the web server, not here - see deploy/nginx.conf.

      They used to be four <meta http-equiv> tags, none of which did anything.
      X-Frame-Options and X-Content-Type-Options are honoured only as HTTP
      response headers and are discarded when they appear in markup; the
      Permissions-Policy meta form was proposed but never shipped in any
      browser; and Referrer-Policy is only read from <meta name="referrer">,
      not from http-equiv. The page therefore had no clickjacking, sniffing or
      permissions protection at all, while appearing to have all three.
    -->

    <title>Marc's Fahrschule Essen - Führerschein A, B, BE, AM</title>
