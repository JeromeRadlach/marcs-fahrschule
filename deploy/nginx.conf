# nginx server block for Marc's Fahrschule.
#
# Assumes the site is served from the domain root. Build it for the root with:
#
#     VITE_DEPLOY=root npm run build       (bash / Linux / CI)
#     $env:VITE_DEPLOY='root'; npm run build   (PowerShell)
#
# and copy dist/ to the root path below. Without that env var the build emits
# asset URLs under /marcs-fahrschule/, which is correct for GitHub Pages and
# wrong here - every script and stylesheet would 404.
#
# The API (server.js, contact form mail) runs separately on port 3001 and is
# reverse-proxied at /api. Run it under a process manager (systemd or pm2) so
# it comes back after a reboot; nginx does not start it.

server {
    listen 80;
    listen [::]:80;
    server_name marcsfahr.schule www.marcsfahr.schule;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marcsfahr.schule www.marcsfahr.schule;

    ssl_certificate     /etc/letsencrypt/live/marcsfahr.schule/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marcsfahr.schule/privkey.pem;

    root /var/www/marcs-fahrschule;
    index index.html;

    # ---------------------------------------------------------------------
    # Security headers
    #
    # These replace four <meta http-equiv> tags that browsers ignored. The
    # `always` flag matters: without it nginx omits the headers on error
    # responses, so a 404 page would ship unprotected.
    #
    # Careful when editing: `add_header` in a nested location REPLACES the
    # whole inherited set rather than adding to it. Any location block that
    # introduces its own add_header must repeat all of these.
    # ---------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Enable only once HTTPS is confirmed working on every subdomain you serve.
    # Browsers cache this for the full max-age and it cannot be withdrawn early.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A full Content-Security-Policy needs the two third parties this site
    # depends on, or it silently breaks them: the Google Maps embed on the
    # contact page, and Google Fonts in index.html. 'unsafe-inline' in
    # style-src is required because the animation library writes inline styles
    # while animating.
    #
    # Roll this out as Content-Security-Policy-Report-Only first and watch the
    # browser console for a day before enforcing it.
    #
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # Contact form API
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # server.js rate-limits per IP. Behind this proxy every request
        # appears to come from 127.0.0.1, which would let one visitor exhaust
        # the limit for everyone, so the API must be started with TRUST_PROXY=1
        # to read the real address out of X-Forwarded-For. It is off by default
        # precisely so that a directly reachable server never trusts a header
        # the client controls. Confirm it took effect: the API logs
        # "Proxy trust: 1 hop(s)" on startup.

        # Repeated because this location declares its own add_header above.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---------------------------------------------------------------------
    # Static assets
    #
    # Vite fingerprints filenames in assets/, so those can be cached forever.
    # Images in images/ are NOT fingerprinted - scripts/optimize-images.mjs
    # writes stable names like vw-taigo-800.webp - so they get a shorter
    # lifetime, otherwise replacing a photo would not reach anyone who had
    # already visited.
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # SPA fallback
    #
    # React Router owns /team, /faq and the rest; those paths do not exist on
    # disk, so a direct visit or a refresh must still be served index.html.
    #
    # index.html itself is never cached: it is the file that names the current
    # fingerprinted bundles, so a stale copy pins visitors to an old release.
    # ---------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
